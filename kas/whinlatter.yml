header:
  version: 14

machine: qemux86-64
distro: poky
target: test-image-qs
build_dir: build-kas/whinlatter

repos:
  meta-quantum-safe:
    path: ../

  # Note: poky does not currently publish a whinlatter branch; we pin to master at the CI SHA.
  poky:
    url: https://git.yoctoproject.org/poky.git
    refspec: 485d9c126adad5764cca8d27fb437be7855b484a
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    refspec: c6849e7529727a2c9eca0f9220836bd0d69ce086
    layers:
      meta-oe:
      meta-python:

local_conf_header:
  meta-quantum-safe: |
    IMAGE_CLASSES += "testimage"
    INHERIT += "rm_work"

    PREFERRED_VERSION_liboqs = "0.15.0"
    PREFERRED_VERSION_liboqs-ptest = "0.15.0"

