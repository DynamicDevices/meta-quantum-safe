header:
  version: 14

machine: qemux86-64
distro: poky
target: test-image-qs
build_dir: build-kas/kirkstone

repos:
  meta-quantum-safe:
    path: ../

  poky:
    url: https://git.yoctoproject.org/poky.git
    refspec: c942cdb0572ab065a13424aa7482404269ff9554
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded.git
    refspec: 7d4507f226bd2af939d4482fb14a809867ece939
    layers:
      meta-oe:
      meta-python:

local_conf_header:
  meta-quantum-safe: |
    IMAGE_CLASSES += "testimage"
    INHERIT += "rm_work"

    PREFERRED_VERSION_liboqs = "0.15.0"
    PREFERRED_VERSION_liboqs-ptest = "0.15.0"

