name: meta-quantum-safe

on:
  push:
    paths-ignore:
      - 'README.md'
    branches:
      - scarthgap
  pull_request:
    branches:
      - scarthgap

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, X64]
    timeout-minutes: 600
    container:
      # Pinned to an immutable digest to avoid CI drift
      image: dynamicdevices/yocto-ci-build@sha256:be170373625e77a6235a0bb3efb84d00be736221782d5d716e88aafd1b965794
      options: --privileged --platform linux/amd64  -v /dev/net/tun:/dev/net/tun -v /dev/kvm:/dev/kvm
    strategy:
      matrix:
        liboqs_version: [0.15.0]
        arch: [x86-64]
    env:
      name: build-and-test
      LIBOQS_VERSION: ${{ matrix.liboqs_version }}
      ARCH: ${{ matrix.arch }}
      BRANCH: scarthgap
      WORKDIR: work/scarthgap-${{ matrix.arch }}-${{ matrix.liboqs_version }}
    steps:
    - name: Checkout meta-quantum-safe
      uses: actions/checkout@v4
      with:
        clean: false
        path: ${{ env.WORKDIR }}/meta-quantum-safe
    - name: Sanity check workspace (no merge conflict markers)
      shell: bash
      run: |
        set -euo pipefail
        LAYER_DIR="$GITHUB_WORKSPACE/${WORKDIR}/meta-quantum-safe"
        # Only scan tracked files, and only match the unambiguous conflict markers.
        # NOTE: '=======' is too common in docs/log output to be a reliable signal on its own.
        if git -C "$LAYER_DIR" grep -n -E '^(<<<<<<<|>>>>>>>)' -- . ; then
          echo "ERROR: merge conflict markers detected in tracked files under $LAYER_DIR"
          exit 1
        fi
    - name: Load CI pins (poky/meta-openembedded)
      shell: bash
      run: |
        set -euo pipefail
        PINS_FILE="$GITHUB_WORKSPACE/${WORKDIR}/meta-quantum-safe/.github/ci-pins.json"
        if [ -f "$PINS_FILE" ]; then
          python3 -c 'import json,os,sys; branch=os.environ["BRANCH"]; pins_file=os.environ["PINS_FILE"]; pins=json.load(open(pins_file,"r",encoding="utf-8")); entry=pins.get(branch); entry or (print("No pins for branch=%s in %s" % (branch, pins_file), file=sys.stderr) or sys.exit(0)); f=open(os.environ["GITHUB_ENV"],"a",encoding="utf-8"); f.write("POKY_REF=%s\n" % entry["poky_ref"]); f.write("POKY_SHA=%s\n" % entry["poky_sha"]); f.write("META_OE_REF=%s\n" % entry["meta_openembedded_ref"]); f.write("META_OE_SHA=%s\n" % entry["meta_openembedded_sha"]); f.close(); print("Pinned %s: poky %s@%s, meta-openembedded %s@%s" % (branch, entry["poky_ref"], entry["poky_sha"], entry["meta_openembedded_ref"], entry["meta_openembedded_sha"]))'
        else
          echo "No pins file found at $PINS_FILE (continuing unpinned)"
        fi
      env:
        PINS_FILE: ${{ github.workspace }}/${{ env.WORKDIR }}/meta-quantum-safe/.github/ci-pins.json
    - name: Update repo poky
      run: |
        set -euo pipefail
        mkdir -p ${WORKDIR}
        if [ ! -d ${WORKDIR}/poky ]; then
          git clone git://git.yoctoproject.org/poky -b ${POKY_REF:-${BRANCH}} ${WORKDIR}/poky
          cd ${WORKDIR}/poky
          git sparse-checkout disable || true
          git checkout -f
          cd ../../..
        else
          cd ${WORKDIR}/poky
          git sparse-checkout disable || true
          git fetch origin ${POKY_REF:-${BRANCH}}
          git reset --hard FETCH_HEAD
          cd ../../..
        fi
        if [ -n "${POKY_SHA:-}" ]; then
          cd ${WORKDIR}/poky
          git checkout -q ${POKY_SHA}
          git sparse-checkout disable || true
          git checkout -f
          cd ../../..
        fi
        # Some runners have persistent workspaces; if an old sparse checkout or partial state
        # causes oe-init-build-env to be missing, reclone cleanly.
        if [ ! -f ${WORKDIR}/poky/oe-init-build-env ]; then
          echo "WARNING: ${WORKDIR}/poky/oe-init-build-env missing after update; recloning poky"
          rm -rf ${WORKDIR}/poky
          git clone git://git.yoctoproject.org/poky -b ${POKY_REF:-${BRANCH}} ${WORKDIR}/poky
          cd ${WORKDIR}/poky
          git sparse-checkout disable || true
          git checkout -f
          cd ../../..
          if [ -n "${POKY_SHA:-}" ]; then
            cd ${WORKDIR}/poky
            git checkout -q ${POKY_SHA}
            git sparse-checkout disable || true
            git checkout -f
            cd ../../..
          fi
        fi
    - name: Update repo meta-openembedded
      run: |
        set -euo pipefail
        mkdir -p ${WORKDIR}
        if [ ! -d ${WORKDIR}/meta-openembedded ]; then
          git clone https://github.com/openembedded/meta-openembedded.git -b ${META_OE_REF:-${BRANCH}} ${WORKDIR}/meta-openembedded
          cd ${WORKDIR}/meta-openembedded
          git sparse-checkout disable || true
          git checkout -f
          cd ../../..
        else
          cd ${WORKDIR}/meta-openembedded
          git sparse-checkout disable || true
          git fetch origin ${META_OE_REF:-${BRANCH}}
          git reset --hard FETCH_HEAD
          cd ../../..
        fi 
        if [ -n "${META_OE_SHA:-}" ]; then
          cd ${WORKDIR}/meta-openembedded
          git checkout -q ${META_OE_SHA}
          git sparse-checkout disable || true
          git checkout -f
          cd ../../..
        fi
    - name: Configuring
      run: |
        if [ ! -f ${WORKDIR}/poky/oe-init-build-env ]; then
          echo "ERROR: missing ${WORKDIR}/poky/oe-init-build-env"
          echo "PWD=$(pwd)"
          echo "Listing ${WORKDIR}:"
          ls -la ${WORKDIR} || true
          echo "Listing work/:"
          ls -la work || true
          exit 1
        fi
        rm -f ${WORKDIR}/build/conf/local.conf
        rm -f ${WORKDIR}/build/conf/bblayers.conf
        . ./${WORKDIR}/poky/oe-init-build-env ${WORKDIR}/build

        # Append custom variables for regenerated local.conf and bblayers.conf samples
        echo "### Starting to configure local.conf and bblayers.conf ###"
        echo "liboqs version: $LIBOQS_VERSION"

        echo "BBLAYERS += '$GITHUB_WORKSPACE/${WORKDIR}/meta-quantum-safe'" >> conf/bblayers.conf
        echo "BBLAYERS += '$GITHUB_WORKSPACE/${WORKDIR}/meta-openembedded/meta-oe'" >> conf/bblayers.conf
        echo "BBLAYERS += '$GITHUB_WORKSPACE/${WORKDIR}/meta-openembedded/meta-python'" >> conf/bblayers.conf

        echo "MACHINE=\"qemu${ARCH}\"" >> conf/local.conf
        # Give QEMU enough RAM for ptests (ptest-pkgs can be heavy).
        if [ "${ARCH}" = "arm64" ]; then
          echo "QB_MEM:qemuarm64 = \"-m 1024\"" >> conf/local.conf
        fi
        if [ "${ARCH}" = "x86-64" ]; then
          echo "QB_MEM:qemux86-64 = \"-m 2048\"" >> conf/local.conf
        fi
        echo "DL_DIR=\"$GITHUB_WORKSPACE/downloads\"" >> conf/local.conf
        echo "SSTATE_DIR=\"$GITHUB_WORKSPACE/sstate-cache\"" >> conf/local.conf

        echo "PREFERRED_VERSION_liboqs=\"${LIBOQS_VERSION}\"" >> conf/local.conf
        echo "PREFERRED_VERSION_liboqs-ptest=\"${LIBOQS_VERSION}\"" >> conf/local.conf

        echo "INHERIT += \" rm_work \"" >> conf/local.conf
        sed -i 's/#IMAGE_CLASSES += "testimage testsdk"/IMAGE_CLASSES += "testimage "/' conf/local.conf
    - name: License QA (populate_lic)
      run: |
        . ./${WORKDIR}/poky/oe-init-build-env ${WORKDIR}/build
        bitbake -c populate_lic liboqs
    - name: Cleaning
      run: |
        . ./${WORKDIR}/poky/oe-init-build-env ${WORKDIR}/build
        bitbake -c cleanall test-image-qs
    - name: Building
      run: |
        . ./${WORKDIR}/poky/oe-init-build-env ${WORKDIR}/build
        bitbake -k test-image-qs
    - name: Testing
      run: |
        . ./${WORKDIR}/poky/oe-init-build-env ${WORKDIR}/build
        export TERM=linux
        bitbake test-image-qs -c testimage
    - name: Store artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: test-image-qs-${{ env.BRANCH }}-${{ matrix.liboqs_version }}-${{ github.sha }}-${{ matrix.arch }}
        path: ./${{ env.WORKDIR }}/build/tmp/deploy/images/qemu${{ matrix.arch }}/
    - name: Store logs
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: logs-${{ env.BRANCH }}-${{ matrix.liboqs_version }}-${{ github.sha }}-${{ matrix.arch }}
        path: |
          ./${{ env.WORKDIR }}/build/conf/local.conf
          ./${{ env.WORKDIR }}/build/conf/bblayers.conf
          ./${{ env.WORKDIR }}/build/tmp/log/**
          ./${{ env.WORKDIR }}/build/tmp/**/console-latest.log
          ./${{ env.WORKDIR }}/build/tmp/work/**/temp/log.do_*
          ./${{ env.WORKDIR }}/build/tmp/work/**/temp/run.do_*
          ./${{ env.WORKDIR }}/build/tmp/work/**/temp/log.task_order
    - name: Store test logs
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: test-logs-${{ env.BRANCH }}-${{ matrix.liboqs_version }}-${{ github.sha }}-${{ matrix.arch }}
        path: |
          ./${{ env.WORKDIR }}/build/tmp/work/**/temp/log.do_testimage
          ./${{ env.WORKDIR }}/build/tmp/work/**/temp/log.do_testimage.*
