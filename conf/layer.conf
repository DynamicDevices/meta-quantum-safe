# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-quantum-safe"
BBFILE_PATTERN_meta-quantum-safe := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-quantum-safe = "5"

# This branch is an integration branch; CI maps it to scarthgap.
LAYERDEPENDS_meta-quantum-safe = "core"
# CI for the whinlatter branch currently builds against poky walnascar (pinned).
LAYERSERIES_COMPAT_meta-quantum-safe = "whinlatter walnascar"

# Default to stable, pinned recipe; users can override to "git" if desired.
PREFERRED_VERSION_liboqs ?= "0.15.0"
